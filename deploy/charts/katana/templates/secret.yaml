{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "katana.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katana.labels" . | nindent 4 }}
type: Opaque
stringData:
  KATANA_TOKEN: {{ .Values.secrets.katanaToken | quote }}
  JFROG_URL: {{ .Values.secrets.jfrogUrl | quote }}
  JFROG_TOKEN: {{ .Values.secrets.jfrogToken | quote }}
  {{- if .Values.secrets.bootstrapAdminUser }}
  KATANA_BOOTSTRAP_ADMIN_USER: {{ .Values.secrets.bootstrapAdminUser | quote }}
  {{- end }}
  {{- if .Values.secrets.bootstrapAdminPassword }}
  KATANA_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientId }}
  KATANA_OIDC_CLIENT_ID: {{ .Values.secrets.oidcClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  KATANA_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
