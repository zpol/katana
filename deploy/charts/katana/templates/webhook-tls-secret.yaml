{{- if and .Values.webhook.createSecret .Values.webhook.tls.cert .Values.webhook.tls.key -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.webhook.tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katana.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.webhook.tls.cert | quote }}
  tls.key: {{ .Values.webhook.tls.key | quote }}
{{- end }}
