# Default KATANA ImagePolicy resources (GitOps-friendly).
# Apply after CRD: kubectl apply -f deploy/crd/default-imagepolicies.yaml
---
apiVersion: katana.dev/v1alpha1
kind: ImagePolicy
metadata:
  name: block-critical
spec:
  displayName: Block Critical
  description: Deny workloads with any Critical CVE (system NS excepted)
  enabled: true
  action: deny
  denyMessage: |
    Image {image} has CRITICAL vulnerabilities (JFrog Xray). Policy: {policy}.
    Upgrade the base image or contact your platform security team for an exception.
  exceptions:
    - kube-system
    - kube-public
    - kube-node-lease
    - katana-system
  match:
    severity: critical
---
apiVersion: katana.dev/v1alpha1
kind: ImagePolicy
metadata:
  name: block-high-in-prod
spec:
  displayName: Block High in Prod
  description: Deny High severity findings in production environments
  enabled: true
  action: deny
  denyMessage: |
    Image {image} has HIGH severity findings in production (env: {environment}). Policy: {policy}.
    Use a patched image version or deploy to a non-prod namespace for testing.
  exceptions:
    - kube-system
    - kube-public
    - kube-node-lease
    - katana-system
  match:
    severity: high
    environment: prod
---
apiVersion: katana.dev/v1alpha1
kind: ImagePolicy
metadata:
  name: require-scanned-image
spec:
  displayName: Require Scanned Image
  description: Deny images with no Xray scan result
  enabled: true
  action: deny
  denyMessage: |
    Image {image} is not indexed in JFrog Xray (scanned=false). Policy: {policy}.
    Ensure the image is scanned in Artifactory/Xray before deploying.
  exceptions:
    - kube-system
    - kube-public
    - kube-node-lease
    - katana-system
  match:
    scanned: false
---
apiVersion: katana.dev/v1alpha1
kind: ImagePolicy
metadata:
  name: allowlist-system-ns
spec:
  displayName: Allowlist System NS
  description: Audit-only log of Pods in platform namespaces (kube-system, kube-public, kube-node-lease, katana-system). Does not allow or block; deny exceptions do that. Safe to disable if you only need enforcement.
  enabled: true
  action: audit
  warnMessage: "System namespace activity recorded. Policy: {policy}."
  match:
    namespaceAllowlist:
      - kube-system
      - kube-public
      - kube-node-lease
      - katana-system
---
apiVersion: katana.dev/v1alpha1
kind: ImagePolicy
metadata:
  name: registry-allowlist
spec:
  displayName: Registry Allowlist
  description: Deny images not from approved registries
  enabled: true
  action: deny
  denyMessage: |
    Image {image} uses registry "{registry}" which is not on the approved list. Policy: {policy}.
    Pull from artifactory.example.com or an approved registry.
  exceptions:
    - kube-system
    - kube-public
    - kube-node-lease
    - katana-system
  match:
    registryAllowlist:
      - artifactory.example.com
      - 123456789012.dkr.ecr.us-east-1.amazonaws.com
---
apiVersion: katana.dev/v1alpha1
kind: ImagePolicy
metadata:
  name: deny-unsafe-pod-security
spec:
  displayName: Deny Unsafe Pod Security
  description: Deny privileged containers, root (UID 0), or allowPrivilegeEscalation
  enabled: true
  action: deny
  denyMessage: |
    Pod security violation in namespace {namespace}. Policy: {policy}. {reason}
    Do not run as root (UID 0), privileged, or with allowPrivilegeEscalation.
  exceptions:
    - kube-system
    - kube-public
    - kube-node-lease
    - katana-system
  match:
    unsafePodSecurity: true
